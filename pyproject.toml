[project]
name = "miles-rag"
version = "0.1.0"
description = "RAG proof-of-concept with hybrid retrieval and evaluation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.32.1",
    "qdrant-client==1.12.1",
    "sentence-transformers==3.3.1",
    "rank-bm25==0.2.2",
    "anthropic==0.39.0",
    "httpx==0.27.2",
    "pydantic==2.10.3",
    "python-dotenv==1.0.1",
    "ragas==0.2.10",
    "datasets==3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.2",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["config", "retrieval", "generation", "ingestion", "custom_judges"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
