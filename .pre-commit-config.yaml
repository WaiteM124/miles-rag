# Pre-commit: matching CI linters + secret scan.
# Enable once: pip install pre-commit && pre-commit install
# See CONTRIBUTING.md.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
